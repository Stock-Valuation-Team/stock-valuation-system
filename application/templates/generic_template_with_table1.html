<!DOCTYPE html>
<html>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 70%;

}



th, td {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 4px;
  font-style: normal;
  font-weight: normal;
}
tr:nth-child(even) {
  background-color: #dddddd;
}
</style>
</head>
<body>
<h2 style="text-align: center;">{{ page_title }}</h2>
<div style="display: grid; justify-items: center;">{{ html_table |safe }}</div>
</body>
</html>
